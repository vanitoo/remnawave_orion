<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title><%= metaTitle %></title>
<style>
:root{
  --bg:#ffffff;
  --ink:#18243c;
  --muted:#667085;
  --line:#e6ebf2;
  --soft:#f4f8fb;
  --accent:#14b8a6;
  --accent2:#0891b2;
  --ok:#16a34a;
  --shadow:0 14px 42px rgba(24,36,60,.10);
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button,a{font:inherit}
a{color:inherit}
.page{width:min(100%,760px);margin:0 auto;padding:34px 24px 48px}
.brand{display:flex;align-items:center;justify-content:center;gap:12px;margin:2px 0 40px}
.brand-mark{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-size:25px;box-shadow:0 10px 24px rgba(8,145,178,.22)}
.brand-name{font-size:25px;font-weight:800;letter-spacing:-.02em}
.status-pill{display:inline-flex;align-items:center;gap:9px;min-height:38px;padding:0 15px;border:1px solid var(--line);border-radius:999px;color:var(--ok);font-size:15px;font-weight:650;background:#fff;box-shadow:0 6px 18px rgba(24,36,60,.04)}
.status-dot{width:9px;height:9px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 5px rgba(22,163,74,.08)}
.hero{margin-top:20px}
.hero h1{margin:0;font-size:clamp(38px,8vw,60px);line-height:1.03;letter-spacing:-.045em}
.hero p{margin:16px 0 0;color:var(--muted);font-size:18px;line-height:1.55}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:28px}
.action{min-height:64px;border:0;border-radius:16px;display:flex;align-items:center;justify-content:center;gap:10px;padding:0 20px;font-size:18px;font-weight:750;text-decoration:none;cursor:pointer;transition:transform .15s ease,box-shadow .15s ease}
.action:active{transform:scale(.985)}
.action-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 14px 30px rgba(8,145,178,.20)}
.action-secondary{background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:var(--shadow)}
.status-line{min-height:22px;margin:12px 4px 0;color:var(--muted);font-size:14px}
.section{margin-top:34px}
.section h2{margin:0 0 12px;font-size:21px}
.download-card{border:1px solid var(--line);border-radius:18px;background:#fff;box-shadow:var(--shadow);overflow:hidden;padding:0 18px}
.download-row{min-height:72px;display:grid;grid-template-columns:44px minmax(0,1fr) 22px;align-items:center;gap:14px;text-decoration:none;font-size:16px;font-weight:650}
.download-row+.download-row{border-top:1px solid var(--line)}
.download-icon{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--soft);font-size:20px}
.chev{color:#778197;font-size:24px;line-height:1}
.benefits{margin-top:34px;padding-top:24px;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.benefit{display:grid;grid-template-columns:36px 1fr;gap:10px;align-items:start}
.benefit-icon{font-size:24px}
.benefit strong{display:block;font-size:15px}
.benefit span{display:block;margin-top:4px;color:var(--muted);font-size:13px;line-height:1.4}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,80px);opacity:0;background:#18243c;color:#fff;padding:11px 16px;border-radius:999px;transition:.2s;z-index:20;white-space:nowrap}
.toast.show{transform:translate(-50%,0);opacity:1}
.error{margin-top:32px;padding:22px;border:1px solid #fecaca;border-radius:18px;background:#fff7f7;color:#991b1b}
@media(max-width:640px){
  .page{padding:max(22px,env(safe-area-inset-top)) 18px max(34px,env(safe-area-inset-bottom))}
  .brand{margin-bottom:32px}.brand-name{font-size:22px}.hero h1{font-size:44px}.hero p{font-size:16px}
  .actions{grid-template-columns:1fr}.action{min-height:60px}
  .benefits{grid-template-columns:1fr;gap:14px}.download-row{min-height:68px}
}
</style>
</head>
<body>
<main class="page">
  <div class="brand">
    <div class="brand-mark">🐾</div>
    <div class="brand-name">Warp Private Network</div>
  </div>
  <div id="app"></div>
</main>
<div id="toast" class="toast">Ссылка скопирована</div>
<script>
let data=null;
try{data=JSON.parse(atob('<%= panelData %>'));}catch(e){console.error(e)}
const response=data?.response||{};
const user=response.user||{};
const sub=response.subscriptionUrl||'';

const DOWNLOADS={
  macos:'https://github.com/Happ-proxy/happ-desktop/releases/latest',
  windows:'https://github.com/Happ-proxy/happ-desktop/releases/latest/download/setup-Happ.x64.exe',
  ios:'https://apps.apple.com/ru/app/happ-proxy-utility-plus/id6788279553',
  android:'https://play.google.com/store/apps/details?id=com.happproxy',
  androidTv:'https://play.google.com/store/apps/details?id=com.happproxy',
  deb:'https://github.com/Happ-proxy/happ-desktop/releases/latest/download/Happ.linux.x64.deb',
  rpm:'https://github.com/Happ-proxy/happ-desktop/releases/latest/download/Happ.linux.x64.rpm',
  arch:'https://github.com/Happ-proxy/happ-desktop/releases/latest/download/Happ.linux.x64.pkg.tar.zst'
};

function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function happUrl(){return sub?'happ://add/'+sub:''}
function expiry(){const raw=user.expiresAt||user.expireAt||'';if(!raw)return'';const d=new Date(raw);return Number.isNaN(d.getTime())?raw:d.toLocaleDateString('ru-RU',{day:'2-digit',month:'long',year:'numeric'})}
function openHapp(){const status=document.getElementById('openStatus');if(status)status.textContent='Пытаемся открыть Happ…';const url=happUrl();if(url)window.location.href=url}
async function copySubscription(){if(!sub)return;try{await navigator.clipboard.writeText(sub)}catch(e){const ta=document.createElement('textarea');ta.value=sub;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove()}const t=document.getElementById('toast');t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1700)}

function render(){
  const app=document.getElementById('app');
  if(!response.isFound||!sub){
    app.innerHTML='<div class="error"><b>Подписка не найдена</b><br><br>Вернитесь в Telegram-бот и обновите доступ.</div>';
    return;
  }
  const exp=expiry();
  app.innerHTML=`
    <div class="status-pill"><span class="status-dot"></span>Подписка активна${exp?' до '+esc(exp):''}</div>
    <section class="hero">
      <h1>Подключите VPN</h1>
      <p>Если Happ уже установлен — откройте подписку одной кнопкой. Если приложения нет, скачайте нужную версию ниже.</p>
      <div class="actions">
        <button id="happActionButton" class="action action-primary" type="button">⚡ Открыть в Happ</button>
        <button id="copyActionButton" class="action action-secondary" type="button">📋 Скопировать ссылку</button>
      </div>
      <div id="openStatus" class="status-line"></div>
    </section>

    <section class="section">
      <h2>Скачать Happ</h2>
      <div class="download-card">
        <a class="download-row" href="${DOWNLOADS.macos}" rel="noopener noreferrer"><span class="download-icon">💻</span><span>Happ для macOS</span><span class="chev">›</span></a>
        <a class="download-row" href="${DOWNLOADS.windows}" rel="noopener noreferrer"><span class="download-icon">⊞</span><span>Happ для Windows</span><span class="chev">›</span></a>
        <a class="download-row" href="${DOWNLOADS.ios}" rel="noopener noreferrer"><span class="download-icon"></span><span>Happ в App Store</span><span class="chev">›</span></a>
        <a class="download-row" href="${DOWNLOADS.android}" rel="noopener noreferrer"><span class="download-icon">▶</span><span>Happ в Google Play</span><span class="chev">›</span></a>
        <a class="download-row" href="${DOWNLOADS.androidTv}" rel="noopener noreferrer"><span class="download-icon">📺</span><span>Happ для Android TV</span><span class="chev">›</span></a>
        <a class="download-row" href="${DOWNLOADS.deb}" rel="noopener noreferrer"><span class="download-icon">🐧</span><span>Happ Linux .deb</span><span class="chev">›</span></a>
        <a class="download-row" href="${DOWNLOADS.rpm}" rel="noopener noreferrer"><span class="download-icon">🐧</span><span>Happ Linux .rpm</span><span class="chev">›</span></a>
        <a class="download-row" href="${DOWNLOADS.arch}" rel="noopener noreferrer"><span class="download-icon">🐧</span><span>Happ Linux pkg</span><span class="chev">›</span></a>
      </div>
    </section>

    <section class="benefits" aria-label="Преимущества Warp Private Network">
      <div class="benefit"><div class="benefit-icon">🛡️</div><div><strong>Безопасно</strong><span>Защищённое подключение и шифрование трафика</span></div></div>
      <div class="benefit"><div class="benefit-icon">🔒</div><div><strong>Приватно</strong><span>Минимум действий и никаких ручных конфигов</span></div></div>
      <div class="benefit"><div class="benefit-icon">⚡</div><div><strong>Быстро</strong><span>Подключение к VPN в одно нажатие</span></div></div>
    </section>
    <noscript><p class="status-line">JavaScript выключен. Скопируйте ссылку подписки вручную: ${esc(sub)}</p></noscript>
  `;
  document.getElementById('happActionButton')?.addEventListener('click',openHapp);
  document.getElementById('copyActionButton')?.addEventListener('click',copySubscription);
}
render();
</script>
</body>
</html>
