<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10151f">
<title>Warp Private Network — подключение</title>
<style>
:root{color-scheme:dark;--bg:#10151f;--card:#171e2a;--border:#283244;--text:#f8fafc;--muted:#aeb8c7;--accent:#39d0e5}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at top right,#16323a 0,#10151f 40%),var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.card{width:min(100%,460px);background:rgba(23,30,42,.96);border:1px solid var(--border);border-radius:22px;padding:26px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.28)}.logo{font-size:42px;margin-bottom:8px}h1{font-size:23px;margin:0 0 8px}p{color:var(--muted);line-height:1.5;margin:0 0 18px}.btn{display:flex;width:100%;align-items:center;justify-content:center;text-decoration:none;border:0;border-radius:14px;padding:15px 18px;font-size:17px;font-weight:750;cursor:pointer;background:linear-gradient(135deg,#28bed4,#54d9e8);color:#071014}.hint{font-size:13px;margin-top:14px;color:var(--muted)}.error{color:#fca5a5}
</style>
</head>
<body>
<div class="card">
  <div class="logo">🐾</div>
  <h1>Warp Private Network</h1>
  <p id="message">Открываем Happ и добавляем VPN…</p>
  <a id="openButton" class="btn" href="#" hidden>⚡ Открыть Happ</a>
  <div class="hint" id="hint">Если приложение не открылось автоматически, нажмите кнопку.</div>
</div>
<script>
(function(){
  const params=new URLSearchParams(location.search);
  const target=params.get('to')||params.get('redirect_to')||'';
  const message=document.getElementById('message');
  const button=document.getElementById('openButton');
  const hint=document.getElementById('hint');

  // Эта страница предназначена только для безопасного перехода в Happ.
  if(!target || !/^happ:\/\//i.test(target)){
    message.textContent='Некорректная ссылка подключения.';
    message.classList.add('error');
    hint.textContent='Вернитесь в Telegram-бот и нажмите «Подключить VPN» ещё раз.';
    return;
  }

  button.href=target;
  button.hidden=false;

  // Небольшая задержка даёт браузеру отрисовать страницу перед deep-link переходом.
  setTimeout(function(){
    try{ location.href=target; }catch(e){ console.error(e); }
  },180);
})();
</script>
</body>
</html>
